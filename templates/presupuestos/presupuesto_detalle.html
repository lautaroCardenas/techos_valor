<div
    class="presupuesto__modal"
    id="presupuesto-modal-{{ presupuesto.pk }}"
    hidden
>
    <div class="presupuesto__modal__contenido">

        <button type="button" class="presupuesto__modal__cerrar">
            &times;
        </button>

        <div class="presupuesto__detalle">
            {% include 'presupuestos/_detalle_contenido.html' with presupuesto=presupuesto %}
        </div>

        <div
            class="presupuesto__edicion"
            hidden
            data-form-url="{% url 'presupuestos:presupuesto_editar_form' presupuesto.pk %}"
        >
            <p>Cargando formulario...</p>
        </div>

    </div>
</div>
