<form
    method="POST"
    action="{% url 'presupuestos:presupuesto_actualizar' pres.pk %}"
    class="presupuesto__form__editar"
>
    {% csrf_token %}

    {{ presupuesto_form.as_p }}
        {% if presupuesto_form.non_field_errors %}
            <div class="obra__form__errors" role="alert">
                {% for error in presupuesto_form.non_field_errors %}
                    <p class="error">{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

    <div class="presupuesto__acciones__editar">
        <button
            type="button"
            class="presupuesto__cancelar__editar"   
        >
            Cancelar
        </button>

        <button type="submit" class="presupuestoactualizar__btn">
            Guardar cambios
        </button>
    </div>
</form>
