
<div
    class="cliente__modal"
    id="cliente__modal"
    data-abrir="{{ abrir_modal_cliente|yesno:'true,false' }}"
    hidden
>
    <div class="cliente__modal__contenido">
        <button type="button" class="cliente__modal__cerrar" id="modal__cerrar__cliente">
            <svg class="cerrar__cliente__btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="none" stroke="currentColor" stroke-dasharray="12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12l7 7M12 12l-7 -7M12 12l-7 7M12 12l7 -7"><animate fill="freeze" attributeName="stroke-dashoffset" dur="0.4s" values="12;0"/></path></svg>
        </button>

        <h2 class="cliente__titulo">Nuevo cliente</h2>

        <form
            method="post"
            action="{% url 'obras:cliente_crear' %}"
            id="cliente__form"
            class="cliente__form"
        >
            {% csrf_token %}
            <input type="hidden" name="origen" value="obra_crear">

            {{ cliente_form.as_p }}

            <button type="submit" class="cliente__btn">Guardar cliente</button>
        </form>
    </div>
</div>
