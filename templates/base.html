{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'styles/global.css' %}">
    {% block extra_css %}{% endblock %}
    <link
      rel="icon"
      type="image/png"
      href="{% static 'images/roof.png' %}"
    />
    <title>Techos Valor | {% block title %}{% endblock %}</title>
  </head>
  <body>
    <header class="header">
      {% block navbar %}
      <nav class="navbar">
        <div class="navbar__home">
          <a href="{% url 'ajustes:ajustes' %}">
            <img
              class="navbar__logo"
              src="{% static 'images/techos_valor_logo.png' %}"
              alt="brands logo"
            />
          </a>
        </div>
        <ul class="navbar__links">
          <li>
            <a
              href="{% url 'presupuestos:presupuestos_total' %}"
              class="navbar__link"
              >Presupuestos</a
            >
          </li>
          <li>
            <a href="{% url 'obras:obras_total' %}" class="navbar__link"
              >Obras</a
            >
          </li>
          <li>
            <a href="{% url 'pagos:pagos_total' %}" class="navbar__link"
              >Pagos</a
            >
          </li>
        </ul>
      </nav>
      {% endblock %}
    </header>
    <main>{% block content %}{% endblock %}</main>
  <script src="{% static 'js/modal-presupuesto.js' %}"></script>
  <script src="{% static 'js/detalle-presupuesto.js' %}"></script>
  <script src="{% static 'js/obra-crear.js' %}"></script>
  {% block extra_js %}{% endblock %}
  </body>
</html>
