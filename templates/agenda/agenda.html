{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'styles/agenda.css' %}">
{% endblock %}

{% block title %}Agenda{% endblock %}

{% block content %}
<section class="agenda">
    <div class="agenda__header">
        <div class="agenda__header__text">
            <h1 class="agenda__titulo">Agenda</h1>
            <p class="agenda__subtitulo">Organizá el trabajo pendiente o por hacer.</p>
        </div>
        <div class="agenda__agregarevento__btn">
            <button type="button" id="btn-agregar-evento" class="agenda__btn">
                <svg class="agenda__btn__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#fff" d="M19 11h-6V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2"/></svg>
                Agregar evento
            </button>
        </div>
    </div>
    <div class="agenda__calendario">
        <div id="calendario"
            data-events-url="{% url 'agenda:agenda_eventos' %}"
            data-create-url="{% url 'agenda:evento_crear' %}"
            data-update-url="{% url 'agenda:evento_editar' 0 %}"
            data-delete-url="{% url 'agenda:evento_borrar' 0 %}"
            data-move-url="{% url 'agenda:evento_mover' 0 %}"></div>

        <dialog id="dialogo-evento" class="agenda__nuevo__dialog">
            <h3 id="titulo-dialogo" class="agenda__nuevo__titulo">Nuevo evento</h3>
            <form id="form-evento" class="agenda__nuevo__form">
                {% csrf_token %}
                {{ form.as_p }}
                <p id="errores-evento"></p>
                <button type="submit" class="agenda__nuevo__btn agenda__btn__guardar">Guardar</button>
                <button type="button" id="eliminar-evento" hidden class="agenda__nuevo__btn agenda__btn__eliminar">Eliminar</button>
                <button type="button" id="cancelar-evento" class="agenda__nuevo__btn agenda__btn__cancelar">Cancelar</button>
            </form>
        </dialog>
    </div>

</section>

{% endblock %}
{% block extra_js %}
<script src="{% static 'vendor/fullcalendar/index.global.min.js' %}"></script>
<script src="{% static 'vendor/fullcalendar/es.global.min.js' %}"></script>
<script src="{% static 'js/agenda.js' %}"></script>
{% endblock %}
