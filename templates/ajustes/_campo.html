<div class="ajustes__campo{% if check %} ajustes__campo--check{% endif %}">
  {% if check %}
    <label>{{ campo }} {{ campo.label }}</label>
  {% else %}
    {{ campo.label_tag }}
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<small class="helptext">{{ campo.help_text }}</small>{% endif %}
  {% for error in campo.errors %}<small class="ajustes__campo__error">{{ error }}</small>{% endfor %}
</div>
